# Offline synthetic experiment. Runs with `safetylens run --config configs/synthetic.yaml --out runs/synthetic`.
experiment: synthetic-config-run
items_path: data/synthetic/items.jsonl
design: full
models:
  - name: fake-null
    provider: fake
    model_id: fake-null
    fake_profile: "null"
  - name: fake-pretext
    provider: fake
    model_id: fake-pretext
    fake_profile: pretext_susceptible
judge:
  name: fake-judge
  provider: fake
  model_id: fake-judge
sampling:
  temperature: 0.0
  max_tokens: 1024
