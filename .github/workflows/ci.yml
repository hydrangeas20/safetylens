name: CI

# Offline only: no secrets are referenced and no paid API is ever called.
# Tests run with network sockets disabled (pytest-socket, see pyproject.toml).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SAFETYLENS_ALLOW_LIVE: "0"

jobs:
  lint-type:
    name: Lint, format, type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.11
      - run: uv run pytest --cov --cov-report=term --cov-report=xml

  historical-audit:
    name: Historical audit regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.11
      - name: Verify derived files against manifest
        run: uv run safetylens historical verify
      - name: Regenerate audit outputs and require no drift
        run: |
          uv run safetylens historical audit
          git diff --exit-code -- historical/

  e2e:
    name: Offline end-to-end replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.11
      - name: One-command demo (synthetic run + strict replay)
        run: uv run safetylens demo --out "$RUNNER_TEMP/demo"
      - name: Live execution is refused
        run: |
          set +e
          uv run safetylens run --config configs/experiment_v1_draft.yaml --out "$RUNNER_TEMP/live"
          code=$?
          test "$code" -eq 2

  safety-scan:
    name: Secret, redaction and history audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the release audit scans every reachable commit
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.11
      - run: uv run safetylens scan
      - name: Audit every blob and commit message in history
        run: uv run safetylens release-audit
      - name: Workflows must not reference secrets
        run: |
          if grep -rn 'secrets\.' .github/workflows; then
            echo "workflows must not use secrets"; exit 1
          fi

  docs:
    name: README and diagram validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse every Mermaid block in README.md with the Mermaid CLI
        run: |
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          awk -v dir="$RUNNER_TEMP" '/^```mermaid/{n++; f=1; next} /^```/{f=0} f{print > (dir "/readme-" n ".mmd")}' README.md
          ls "$RUNNER_TEMP"/readme-*.mmd
          for f in "$RUNNER_TEMP"/readme-*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.16.0 -p "$RUNNER_TEMP/puppeteer.json" -i "$f" -o "${f%.mmd}.svg"
          done
      - name: Banner and diagram assets exist
        run: |
          test -s assets/safetylens-hero.png
          test -s docs/diagrams/architecture.png
